apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gateway
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/brenner-santos/template-data-platform-k8s-do.git
    targetRevision: main
    path: shared/gateway

  destination:
    server: https://kubernetes.default.svc
    namespace: shared

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true